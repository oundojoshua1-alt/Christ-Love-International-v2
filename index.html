<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Christ Love International | Christ. Love. Mission.</title>

    <meta name="description" content="Christ Love International is a Christ-centered mission sharing the Gospel, making disciples, mentoring lives, empowering communities and demonstrating the love of Christ through practical service.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f8f6;
            color: #172033;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img,
        svg {
            max-width: 100%;
        }

        /* =========================
           COLORS
        ========================= */

        :root {
            --navy: #071426;
            --navy-dark: #050d19;
            --gold: #d4af37;
            --gold-light: #e5c65a;
            --white: #ffffff;
            --cream: #f8f8f6;
            --text: #172033;
            --muted: #667085;
            --border: #e5e7eb;
        }

        /* =========================
           NAVIGATION
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(7, 20, 38, 0.97);
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
        }

        .nav {
            max-width: 1180px;
            margin: auto;
            min-height: 76px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            flex-shrink: 0;
        }

        /* Small refined logo */
        .logo {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }

        .brand-text strong {
            display: block;
            color: var(--white);
            font-size: 17px;
            letter-spacing: 1.5px;
            line-height: 1.1;
        }

        .brand-text span {
            display: block;
            color: var(--gold);
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-top: 3px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 22px;
            font-size: 13px;
            color: #e5e7eb;
        }

        nav a {
            transition: 0.2s ease;
        }

        nav a:hover {
            color: var(--gold);
        }

        .nav-button {
            padding: 9px 16px;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-weight: bold;
            font-size: 12px;
            transition: 0.2s ease;
            white-space: nowrap;
        }

        .nav-button:hover {
            background: var(--gold);
            color: var(--navy);
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            background: var(--navy);
            color: var(--white);
            padding: 100px 24px 105px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.035);
            top: -250px;
            right: -170px;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 850px;
            margin: auto;
        }

        .eyebrow {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(38px, 6vw, 68px);
            line-height: 1.08;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        .hero h1 span {
            color: var(--gold);
        }

        .hero p {
            max-width: 700px;
            margin: 0 auto 30px;
            color: #d5dae2;
            font-size: 17px;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid var(--gold);
            transition: 0.2s ease;
        }

        .btn-primary {
            background: var(--gold);
            color: var(--navy);
        }

        .btn-primary:hover {
            background: var(--gold-light);
        }

        .btn-outline {
            color: var(--white);
        }

        .btn-outline:hover {
            background: var(--gold);
            color: var(--navy);
        }

        /* =========================
           GENERAL SECTIONS
        ========================= */

        section {
            scroll-margin-top: 85px;
        }

        .section {
            padding: 78px 24px;
        }

        .section-light {
            background: var(--cream);
        }

        .section-white {
            background: var(--white);
        }

        .section-dark {
            background: var(--navy);
            color: var(--white);
        }

        .container {
            max-width: 1120px;
            margin: auto;
        }

        .section-heading {
            max-width: 760px;
            margin: 0 auto 45px;
            text-align: center;
        }

        .section-heading .eyebrow {
            margin-bottom: 10px;
        }

        .section-heading h2 {
            font-size: clamp(28px, 4vw, 40px);
            line-height: 1.2;
            margin-bottom: 14px;
            color: var(--text);
        }

        .section-heading h2 span {
            color: var(--gold);
        }

        .section-heading p {
            color: var(--muted);
            max-width: 680px;
            margin: auto;
        }

        .dark-heading h2 {
            color: var(--white);
        }

        .dark-heading p {
            color: #cbd1da;
        }

        /* =========================
           ABOUT
        ========================= */

        .about-grid {
            display: grid;
            grid-template-columns: 1.35fr 0.65fr;
            gap: 45px;
            align-items: center;
        }

        .about-text h3 {
            font-size: 27px;
            color: var(--navy);
            margin-bottom: 16px;
        }

        .about-text p {
            color: var(--muted);
            margin-bottom: 15px;
        }

        .verse-box {
            margin-top: 25px;
            padding: 20px 22px;
            border-left: 4px solid var(--gold);
            background: var(--white);
        }

        .verse-box p {
            font-style: italic;
            color: var(--text);
            margin-bottom: 5px;
        }

        .verse-box strong {
            color: var(--gold);
            font-size: 13px;
        }

        .about-card {
            background: var(--navy);
            color: var(--white);
            padding: 30px;
            border: 1px solid rgba(212, 175, 55, 0.35);
        }

        .about-card h3 {
            color: var(--gold);
            margin-bottom: 12px;
        }

        .about-card p {
            color: #d5dae2;
            font-size: 14px;
        }

        /* =========================
           VISION / MISSION
        ========================= */

        .two-column {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .simple-card {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 30px;
        }

        .simple-card.dark {
            background: var(--navy);
            border-color: rgba(212, 175, 55, 0.3);
            color: var(--white);
        }

        .card-label {
            color: var(--gold);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .simple-card h3 {
            font-size: 25px;
            margin-bottom: 12px;
        }

        .simple-card p {
            color: var(--muted);
        }

        .simple-card.dark p {
            color: #d5dae2;
        }

        /* =========================
           VALUES
        ========================= */

        .cards-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .value-card {
            background: var(--white);
            padding: 25px;
            border: 1px solid var(--border);
            transition: 0.2s ease;
        }

        .value-card:hover {
            border-color: var(--gold);
        }

        .number {
            color: var(--gold);
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .value-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--navy);
        }

        .value-card p {
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           OBJECTIVES
        ========================= */

        .objectives {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .objective {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 23px;
        }

        .objective-number {
            color: var(--gold);
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .objective h3 {
            color: var(--navy);
            font-size: 16px;
            margin-bottom: 7px;
        }

        .objective p {
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           PROGRAM PILLARS
        ========================= */

        .pillar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .pillar {
            background: var(--navy);
            color: var(--white);
            padding: 28px 22px;
            border-top: 3px solid var(--gold);
        }

        .pillar h3 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 18px;
        }

        .pillar p {
            color: #cbd1da;
            font-size: 14px;
        }

        /* =========================
           MINISTRIES
        ========================= */

        .ministry-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .ministry {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 25px;
        }

        .ministry-icon {
            color: var(--gold);
            font-size: 24px;
            margin-bottom: 13px;
        }

        .ministry h3 {
            color: var(--navy);
            margin-bottom: 8px;
        }

        .ministry p {
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           SCRIPTURE
        ========================= */

        .scripture {
            background: var(--navy);
            color: var(--white);
            padding: 85px 24px;
            text-align: center;
        }

        .scripture blockquote {
            max-width: 800px;
            margin: auto;
            font-size: clamp(22px, 3vw, 31px);
            line-height: 1.5;
            font-style: italic;
        }

        .scripture cite {
            display: block;
            margin-top: 20px;
            color: var(--gold);
            font-style: normal;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* =========================
           FAITH IN ACTION
        ========================= */

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            max-width: 850px;
            margin: auto;
        }

        .action-item {
            padding: 20px;
            background: var(--white);
            border-left: 3px solid var(--gold);
            border-bottom: 1px solid var(--border);
        }

        .action-item strong {
            color: var(--navy);
        }

        /* =========================
           IMPACT
        ========================= */

        .impact {
            background: var(--gold);
            color: var(--navy);
            text-align: center;
            padding: 75px 24px;
        }

        .impact h2 {
            font-size: clamp(29px, 4vw, 43px);
            margin-bottom: 12px;
        }

        .impact p {
            max-width: 720px;
            margin: auto;
            font-size: 17px;
        }

        .impact strong {
            display: block;
            margin-top: 20px;
            font-size: 18px;
        }

        /* =========================
           GET INVOLVED
        ========================= */

        .involvement-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .involvement {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 30px;
            text-align: center;
        }

        .involvement h3 {
            color: var(--navy);
            margin: 12px 0 8px;
        }

        .involvement-icon {
            font-size: 26px;
            color: var(--gold);
        }

        .involvement p {
            color: var(--muted);
            font-size: 14px;
        }

        /* =========================
           CONTACT
        ========================= */

        .contact {
            background: var(--white);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
            align-items: start;
        }

        .contact-info h3 {
            color: var(--navy);
            font-size: 27px;
            margin-bottom: 13px;
        }

        .contact-info p {
            color: var(--muted);
            margin-bottom: 22px;
        }

        .contact-item {
            margin-bottom: 15px;
        }

        .contact-item strong {
            display: block;
            color: var(--navy);
            font-size: 14px;
        }

        .contact-item span {
            color: var(--muted);
            font-size: 14px;
        }

        .contact-box {
            background: var(--navy);
            color: var(--white);
            padding: 30px;
        }

        .contact-box h3 {
            color: var(--gold);
            margin-bottom: 10px;
        }

        .contact-box p {
            color: #d5dae2;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: var(--navy-dark);
            color: #aeb6c2;
            padding: 35px 24px;
            text-align: center;
        }

        .footer-brand {
            color: var(--white);
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .footer-brand span {
            color: var(--gold);
        }

        footer p {
            font-size: 12px;
            margin-top: 8px;
        }

        .footer-tagline {
            color: var(--gold);
            font-style: italic;
            margin-top: 12px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {
            nav {
                display: none;
            }

            .nav-button {
                display: none;
            }

            .about-grid,
            .contact-grid {
                grid-template-columns: 1fr;
            }

            .objectives,
            .pillar-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .cards-3 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .nav {
                min-height: 68px;
                padding: 8px 16px;
            }

            .logo {
                width: 42px;
                height: 42px;
            }

            .brand-text strong {
                font-size: 15px;
            }

            .brand-text span {
                font-size: 8px;
            }

            .hero {
                padding: 75px 20px 80px;
            }

            .hero p {
                font-size: 15px;
            }

            .section {
                padding: 62px 20px;
            }

            .two-column,
            .cards-3,
            .objectives,
            .pillar-grid,
            .ministry-grid,
            .action-grid,
            .involvement-grid {
                grid-template-columns: 1fr;
            }

            .section-heading {
                margin-bottom: 32px;
            }

            .simple-card,
            .value-card,
            .objective,
            .pillar,
            .ministry,
            .involvement {
                padding: 22px;
            }

            .scripture {
                padding: 65px 20px;
            }

            .impact {
                padding: 60px 20px;
            }
        }
    </style>
</head>
